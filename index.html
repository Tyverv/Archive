<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <p class="eyebrow">v0.3.1-alpha</p>
        <h1>Archive</h1>
        <p class="subtitle">A cleaner local catalog for everything you store.</p>
      </div>
      <span id="item-count" class="item-count" aria-live="polite"></span>
    </header>

    <section class="panel" aria-label="Item editor">
      <h2>Add or update item</h2>
      <form id="item-form">
        <label for="name">Name</label>
        <input id="name" placeholder="Vintage camera" required minlength="2" maxlength="80" />

        <label for="category">Category <span class="hint">optional</span></label>
        <input id="category" placeholder="Electronics" maxlength="50" />

        <label for="location">Location <span class="hint">optional</span></label>
        <input id="location" placeholder="Shelf A-3" maxlength="50" />

        <button type="submit">Add</button>
      </form>
      <p id="form-feedback" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-label="Find and organize items">
      <h2>Find & organize</h2>
      <div class="toolbar">
        <input id="search" placeholder="Search name, category, or location" />
        <button id="clear-search" type="button" class="secondary">Clear</button>
      </div>

      <div class="controls" aria-label="Sort and filter controls">
        <label>
          Sort
          <select id="sort-by">
            <option value="created-desc">Newest first</option>
            <option value="created-asc">Oldest first</option>
            <option value="name-asc">Name A → Z</option>
            <option value="name-desc">Name Z → A</option>
            <option value="category-asc">Category A → Z</option>
            <option value="category-desc">Category Z → A</option>
            <option value="location-asc">Location A → Z</option>
            <option value="location-desc">Location Z → A</option>
          </select>
        </label>

        <label class="check-option">
          <input type="checkbox" id="filter-uncategorized" />
          Uncategorized only
        </label>

        <label class="check-option">
          <input type="checkbox" id="filter-unknown-location" />
          Unknown location only
        </label>

        <button id="reset-controls" type="button" class="secondary">Reset filters</button>
      </div>

      <div class="data-actions">
        <button id="export-btn" type="button" class="secondary">Export JSON</button>
        <label class="import-label secondary" for="import-file">Import JSON</label>
        <input id="import-file" type="file" accept="application/json" hidden />
      </div>
    </section>

    <section class="panel" aria-label="Saved items">
      <h2>Items</h2>
      <ul id="item-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
